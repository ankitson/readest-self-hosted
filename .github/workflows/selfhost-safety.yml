name: Selfhost Safety

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - selfhost-main
  pull_request:
    branches:
      - main
      - selfhost-main

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Run public fork safety scan
        run: bash scripts/scan-public-fork-safety.sh

